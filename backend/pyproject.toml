[project]
name = "timesliceiq-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "uvicorn==0.34.0",
    "youtube-transcript-api==1.2.3",
    "google-genai==1.0.0",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "numpy==2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
